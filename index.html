  <script>
    const RAW_URL =
      'https://greysmokez.github.io/CJC-Website/kit.txt';

    const PDF_URL =
      'https://github.com/Greysmokez/Continuous-Jubilee-Calendar/blob/main/CJC_AI_Research_Kit.pdf';

    const CHAPTER1_URL =
      'https://github.com/Greysmokez/Continuous-Jubilee-Calendar/blob/main/Chapter1.pdf';

    const API_BASE =
      (window.CJC_API_BASE || '').trim();

    const FETCH_REPO_URL =
      API_BASE ? new URL('/api/fetch-repo', API_BASE).toString() : '';

    const CJC_KIT_REPO =
      'Greysmokez/Continuous-Jubilee-Calendar';

    const PREFILL_TIMEOUT_MS = 8000;

    const CJC_TUTOR_PROMPT = `You are an expert tutor for the Continuous Jubilee Calendar (CJC) method.

Primary source materials:
1) https://raw.githubusercontent.com/Greysmokez/Continuous-Jubilee-Calendar/main/CJCKit.txt
2) https://raw.githubusercontent.com/Greysmokez/Continuous-Jubilee-Calendar/main/CJC_AI_Research_Kit_PasteReady.txt
3) https://greysmokez.github.io/Continuous-Jubilee-Calendar/chapter1.html

Your job:
- Teach the CJC method clearly to beginners and advanced users.
- Answer user questions using the CJC sources above.
- When uncertain, state uncertainty clearly.
- Keep explanations step-by-step.
- Cite which source content the answer is based on.
- If asked for calculations, show exact math and assumptions.
- If asked about scripture links, provide references and explain relevance.
- Do not invent unsupported claims outside provided CJC materials.

Response format:
1) Short direct answer
2) Step-by-step explanation
3) Supporting CJC references used
4) Optional “next question you can ask me”`;

    function makePrompt(){
      return CJC_TUTOR_PROMPT;
    }

    async function copyTextToClipboard(text){
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();

          const ok = document.execCommand('copy');
          ta.remove();

          return !!ok;
        } catch {
          return false;
        }
      }
    }

    async function fetchRawKit(){
      const resp = await fetch(RAW_URL);

      if(!resp.ok){
        throw new Error('raw fetch failed: ' + resp.status);
      }

      return await resp.text();
    }

    async function fetchRepoPrefill(provider){
      const fallbackUrl =
        (provider && platformUrls && platformUrls[provider])
          || platformUrls.chatgpt;

      if(!FETCH_REPO_URL){
        return {
          type: 'copied',
          openUrl: fallbackUrl,
          message: 'No API endpoint configured. Falling back to local copy/open flow.'
        };
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), PREFILL_TIMEOUT_MS);

      try {
        const resp = await fetch(FETCH_REPO_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            action: 'prefill',
            repo: CJC_KIT_REPO,
            provider
          }),
          signal: controller.signal
        });

        if(!resp.ok){
          throw new Error('prefill fetch failed: ' + resp.status);
        }

        return await resp.json();
      } catch (error) {
        console.warn('fetchRepoPrefill failed, falling back to manual copy flow:', error);
        return {
          type: 'copied',
          openUrl: fallbackUrl,
          message: 'Prefill endpoint unavailable. Falling back to local copy/open flow.'
        };
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function flashCopied(btn, ok, successText='Copied'){
      if(!btn) return;

      const original = btn.textContent;

      btn.textContent = ok ? successText : 'Copy failed';
      btn.classList.add('copied');

      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    }

    function safeOpen(url, statusEl){
      try {
        const win = window.open(url, '_blank', 'noopener');

        if(!win && statusEl){
          statusEl.textContent =
            'Popup blocked. Please allow popups for this site.';
        }
      } catch {
        if(statusEl){
          statusEl.textContent =
            'Could not open link. Please try again.';
        }
      }
    }

    function setStatusText(statusEl, text, preserveWhitespace=false){
      if(!statusEl) return;

      statusEl.style.whiteSpace =
        preserveWhitespace ? 'pre-wrap' : '';

      statusEl.textContent = text;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const copyPdfUrlBtn =
        document.getElementById('copyPdfUrlBtn');

      const copyRawUrlBtn =
        document.getElementById('copyRawUrlBtn');

      const copyChapter1Btn =
        document.getElementById('copyChapter1Btn');

      const copyRawTextBtn =
        document.getElementById('copyRawTextBtn');

      const openAiPromptBtn =
        document.getElementById('openAiPromptBtn');

      const aiPlatform =
        document.getElementById('aiPlatform');

      const openAiStatus =
        document.getElementById('openAiStatus');

      const platformUrls = {
        chatgpt: 'https://chat.openai.com/',
        grok: 'https://grok.com/',
        perplexity: 'https://www.perplexity.ai/'
      };

      const platformNames = {
        chatgpt: 'ChatGPT',
        grok: 'Grok',
        perplexity: 'Perplexity'
      };

      if(copyChapter1Btn){
        copyChapter1Btn.addEventListener('click', async () => {
          const ok = await copyTextToClipboard(CHAPTER1_URL);
          flashCopied(copyChapter1Btn, ok);
        });
      }

      if(copyPdfUrlBtn){
        copyPdfUrlBtn.addEventListener('click', async () => {
          const ok = await copyTextToClipboard(PDF_URL);
          flashCopied(copyPdfUrlBtn, ok);
        });
      }

      if(copyRawUrlBtn){
        copyRawUrlBtn.addEventListener('click', async () => {
          const ok = await copyTextToClipboard(RAW_URL);
          flashCopied(copyRawUrlBtn, ok);
        });
      }

      if(copyRawTextBtn){
        copyRawTextBtn.addEventListener('click', async () => {
          try {
            const txt = await fetchRawKit();
            const ok = await copyTextToClipboard(txt);
            flashCopied(copyRawTextBtn, ok, 'Raw Text Copied');
          } catch {
            flashCopied(copyRawTextBtn, false);
          }
        });
      }

      if(openAiPromptBtn){
        openAiPromptBtn.addEventListener('click', async () => {
          const selected =
            (aiPlatform && aiPlatform.value)
              ? aiPlatform.value
              : 'chatgpt';

          const platformName =
            platformNames[selected] || 'ChatGPT';

          const promptText = makePrompt();
          const fallbackUrl =
            platformUrls[selected] || platformUrls.chatgpt;

          try {
            const prefill = await fetchRepoPrefill(selected);

            if(prefill && prefill.type === 'assistant' && prefill.text){
              setStatusText(
                openAiStatus,
                `Assistant response:\n\n${prefill.text}`,
                true
              );

              flashCopied(
                openAiPromptBtn,
                true,
                'Response Ready'
              );

              return;
            }

            if(prefill && prefill.type === 'redirect' && prefill.url){
              const ok = await copyTextToClipboard(promptText);

              setStatusText(
                openAiStatus,
                ok
                  ? `Prompt copied. Opening ${platformName} with a prefilled search.`
                  : `Opening ${platformName} with a prefilled search. Copy the prompt manually if needed.`
              );

              safeOpen(prefill.url, openAiStatus);

              flashCopied(
                openAiPromptBtn,
                ok,
                'Prompt Copied + Opened'
              );

              return;
            }

            if(prefill && prefill.type === 'copied'){
              const ok = await copyTextToClipboard(promptText);

              setStatusText(
                openAiStatus,
                ok
                  ? `Prompt copied. Paste into ${platformName}.`
                  : 'Clipboard copy failed. Copy manually if needed.'
              );

              safeOpen(
                prefill.openUrl || fallbackUrl,
                openAiStatus
              );

              flashCopied(
                openAiPromptBtn,
                ok,
                'Prompt Copied + Opened'
              );

              return;
            }

            const ok = await copyTextToClipboard(promptText);
            setStatusText(
              openAiStatus,
              ok
                ? `Prompt copied. Paste into ${platformName}.`
                : 'Clipboard copy failed. Copy manually if needed.'
            );
            safeOpen(fallbackUrl, openAiStatus);
            flashCopied(openAiPromptBtn, ok, 'Prompt Copied + Opened');
          } catch (error) {
            console.warn('Open AI prompt fallback error:', error);
            const ok = await copyTextToClipboard(promptText);
            setStatusText(
              openAiStatus,
              ok
                ? `Prompt copied. Paste into ${platformName}.`
                : 'Clipboard copy failed. Copy manually if needed.'
            );
            safeOpen(fallbackUrl, openAiStatus);
            flashCopied(openAiPromptBtn, ok, 'Prompt Copied + Opened');
          }
        });
      }

      document
        .querySelectorAll('#aiListContainer .ai-btn')
        .forEach(a => {
          a.addEventListener('click', async (e) => {
            e.preventDefault();

            const href = e.currentTarget.getAttribute('href');
            const prompt = makePrompt();
            const ok = await copyTextToClipboard(prompt);
            if(href) safeOpen(href, openAiStatus);
            if(openAiStatus){
              openAiStatus.textContent = ok
                ? 'Prompt copied. Paste into your selected assistant.'
                : 'Clipboard copy failed. Copy manually if needed.';
            }
          });
        });
    });
  </script>
