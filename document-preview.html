<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Preview</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }
    header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { text-decoration: none; background: #1f6feb; color: #fff; padding: 8px 12px; border-radius: 6px; }
    .btn.secondary { background: #2f855a; }
    iframe { width: 100%; height: calc(100vh - 62px); border: 0; display: block; background: #fff; }
    #message { padding: 16px; }
  </style>
</head>
<body>
  <header>
    <strong id="docName">Document Preview</strong>
    <a id="downloadBtn" class="btn secondary" download>Download Word</a>
    <a href="./index.html#supporting-documents" class="btn">Back to Homepage</a>
  </header>
  <iframe id="previewFrame" title="Word document preview"></iframe>
  <div id="message" hidden>Invalid or unsupported document requested.</div>

  <script>
    const RAW_REPO_OWNER = 'Greysmokez';
    const RAW_REPO_NAME = 'Continuous-Jubilee-Calendar';
    const RAW_REPO_BRANCH = 'main';
    const ALLOWED_FILES = new Set(['Chapter1.docx', 'Crucifixion.docx', 'Isaiah61CJCMath.docx']);

    const params = new URLSearchParams(window.location.search);
    const file = params.get('file') || '';
    const docName = document.getElementById('docName');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewFrame = document.getElementById('previewFrame');
    const message = document.getElementById('message');

    if (!ALLOWED_FILES.has(file)) {
      previewFrame.hidden = true;
      message.hidden = false;
    } else {
      const rawSource = `https://raw.githubusercontent.com/${RAW_REPO_OWNER}/${RAW_REPO_NAME}/${RAW_REPO_BRANCH}/${encodeURIComponent(file)}`;
      const officeUrl = `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(rawSource)}`;
      docName.textContent = file;
      downloadBtn.href = rawSource;
      previewFrame.src = officeUrl;
    }
  </script>
</body>
</html>
