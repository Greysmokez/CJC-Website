<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Preview</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }
    header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { text-decoration: none; background: #1f6feb; color: #fff; padding: 8px 12px; border-radius: 6px; }
    .btn.secondary { background: #2f855a; }
    iframe { width: 100%; height: calc(100vh - 62px); border: 0; display: block; background: #fff; }
    #message { padding: 16px; }
  </style>
</head>
<body>
  <header>
    <strong id="docName">Document Preview</strong>
    <a id="downloadBtn" class="btn secondary" download>Download Word</a>
    <a href="./index.html#supporting-documents" class="btn">Back to Homepage</a>
  </header>
  <iframe id="previewFrame" title="Word document preview"></iframe>
  <div id="message" hidden>Invalid or unsupported document requested.</div>

  <script>
    const RAW_REPO_OWNER = 'Greysmokez';
    const RAW_REPO_NAME = 'Continuous-Jubilee-Calendar';
    const RAW_REPO_BRANCH = 'main';

    // Backward-compatible aliases for legacy query values.
    // Update values to real paths in Continuous-Jubilee-Calendar as needed.
    const FILE_ALIASES = {
      'Chapter1.docx': 'docs/Chapter1.docx',
      'Crucifixion.docx': 'docs/Crucifixion.docx',
      'Isaiah61CJCMath.docx': 'docs/Isaiah61CJCMath.docx'
    };

    const params = new URLSearchParams(window.location.search);
    const requestedFile = (params.get('file') || '').trim();
    const docName = document.getElementById('docName');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewFrame = document.getElementById('previewFrame');
    const message = document.getElementById('message');

    // Allow either legacy aliases or explicit subfolder paths.
    // Basic safety: no absolute URLs and no path traversal.
    const isSafeRelativePath = (value) => {
      if (!value) return false;
      if (value.includes('..')) return false;
      if (value.startsWith('/') || value.startsWith('\\')) return false;
      if (/^[a-zA-Z]+:\/\//.test(value)) return false;
      return value.toLowerCase().endsWith('.docx');
    };

    const normalizedPath = FILE_ALIASES[requestedFile] || requestedFile;

    if (!isSafeRelativePath(normalizedPath)) {
      previewFrame.hidden = true;
      message.hidden = false;
      message.textContent = 'Invalid document requested.';
    } else {
      const encodedPath = normalizedPath
        .split('/')
        .map(segment => encodeURIComponent(segment))
        .join('/');

      const rawSource = `https://raw.githubusercontent.com/${RAW_REPO_OWNER}/${RAW_REPO_NAME}/${RAW_REPO_BRANCH}/${encodedPath}`;
      const officeUrl = `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(rawSource)}`;

      docName.textContent = requestedFile || normalizedPath;
      downloadBtn.href = rawSource;
      previewFrame.src = officeUrl;
    }
  </script>
</body>
</html>
