<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Preview</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; color: #222; }
    header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { text-decoration: none; background: #1f6feb; color: #fff; padding: 8px 12px; border-radius: 6px; }
    .btn.secondary { background: #2f855a; }
    iframe { width: 100%; height: calc(100vh - 62px); border: 0; display: block; background: #fff; }
    #message { padding: 16px; }
  </style>
</head>
<body>
  <header>
    <strong id="docName">Document Preview</strong>
    <a id="downloadBtn" class="btn secondary" download>Download Word</a>
    <a href="./index.html#supporting-documents" class="btn">Back to Homepage</a>
  </header>
  <iframe id="previewFrame" title="Document preview"></iframe>
  <div id="message" hidden>Invalid or unsupported document requested.</div>

  <script>
    const RAW_REPO_OWNER = 'Greysmokez';
    const RAW_REPO_NAME = 'Continuous-Jubilee-Calendar';
    const RAW_REPO_BRANCH = 'main';

    // Keep legacy links working without changing the homepage behavior.
    const FILE_ALIASES = {
      'Chapter1.docx': 'chapter1.html',
      'Chapter1.pdf': 'chapter1.html',
      'Crucifixion.docx': 'Crucifixion.docx',
      'Isaiah61CJCMath.docx': 'Isaiah61CJCMath.docx',
      'chapter1.html': 'chapter1.html'
    };

    const params = new URLSearchParams(window.location.search);
    const requestedFile = (params.get('file') || '').trim();
    const docName = document.getElementById('docName');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewFrame = document.getElementById('previewFrame');
    const message = document.getElementById('message');

    const normalizePath = (value) => {
      if (!value) return '';
      return value.replace(/\\/g, '/').trim();
    };

    const PROTECTED_FILE_NAMES = new Set([
      'Chapter1.docx',
      'Chapter1.pdf',
      'Decree2Cross.docx',
      'Decree2Cross.pdf',
      'Crucifixion.docx',
      'Crucifixion.pdf',
      'Art Thou He.docx',
      'Art Thou He.pdf',
      'Isaiah61CJCMath.docx',
      'Isaiah61CJCMath.pdf',
      'BrittleCoalition.docx',
      'BrittleCoalition.pdf',
      'The_Jubilee_Calendar_and_the_Story_of_the_End.docx',
      'The_Jubilee_Calendar_and_the_Story_of_the_End.pdf'
    ]);

    const resolveProtectedPath = (value) => {
      if (!/\.(docx|pdf)$/i.test(value)) {
        return value;
      }
      if (value.includes('/')) {
        return value;
      }
      const fileName = value.split('/').pop();
      if (PROTECTED_FILE_NAMES.has(fileName)) {
        return `protected-assets/${fileName}`;
      }
      return value;
    };

    const isSafeRelativePath = (value) => {
      if (!value) return false;
      if (value.includes('..')) return false;
      if (value.startsWith('/') || value.startsWith('\\')) return false;
      if (/^[a-zA-Z]+:\/\//.test(value)) return false;
      return /\.(docx|pdf|html)$/i.test(value);
    };

    const normalizedPath = FILE_ALIASES[requestedFile] || normalizePath(requestedFile);

    if (!isSafeRelativePath(normalizedPath)) {
      previewFrame.hidden = true;
      message.hidden = false;
      message.textContent = 'Invalid document requested.';
    } else {
      const sourcePath = resolveProtectedPath(normalizedPath);
      const encodedPath = sourcePath
        .split('/')
        .map(segment => encodeURIComponent(segment))
        .join('/');

      const rawSource = `https://raw.githubusercontent.com/${RAW_REPO_OWNER}/${RAW_REPO_NAME}/${RAW_REPO_BRANCH}/${encodedPath}`;
      const pagesSource = `https://${RAW_REPO_OWNER.toLowerCase()}.github.io/${RAW_REPO_NAME}/${encodedPath}`;
      const isWord = normalizedPath.toLowerCase().endsWith('.docx');
      const isPdf = normalizedPath.toLowerCase().endsWith('.pdf');

      docName.textContent = requestedFile || normalizedPath;
      previewFrame.hidden = false;
      message.hidden = true;

      // Keep the download action aligned with the file type being previewed.
      downloadBtn.href = rawSource;
      downloadBtn.textContent = isWord ? 'Download Word' : 'Download PDF';
      downloadBtn.setAttribute(
        'aria-label',
        isWord ? 'Download Word document' : 'Download PDF document'
      );

      if (isWord) {
        const officeUrl = `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(rawSource)}`;
        previewFrame.src = officeUrl;
      } else if (isPdf) {
        previewFrame.src = pagesSource;
      } else {
        // HTML pages (such as the Chapter 1 custom landing page) should still open
        // within the same preview page flow used elsewhere.
        previewFrame.src = pagesSource;
      }
    }
  </script>
</body>
</html>
